<!doctype html>
<html lang="et">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tagasiside</title>
<h1>Tagasiside</h1>
<form>
  <label>Eesnimi <input name="eesnimi" maxlength="255" required></label><br>
  <label>Perenimi <input name="perenimi" maxlength="255" required></label><br>
  <label>Grupp <input name="grupp" maxlength="255" required></label><br>
  <label>Hinne <input name="hinne" type="number" min="1" max="5" step="1" required></label><br>
  <label>Kommentaar <input name="kommentaar" maxlength="255"></label><br>
  <button>Saada</button>
</form>
<p role="status"></p>
<a href="opetajavaade.html">Vaata kõiki hindeid</a>
<script>
const form = document.querySelector('form'), status = document.querySelector('[role=status]');
form.onsubmit = async event => {
  event.preventDefault();
  form.querySelector('button').disabled = true;
  try {
    const data = Object.fromEntries(new FormData(form));
    data.hinne = Number(data.hinne);
    const response = await fetch('/scores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (!response.ok) throw new Error(await response.text());
    form.reset();
    status.textContent = 'Salvestatud.';
  } catch (error) { status.textContent = error.message; }
  form.querySelector('button').disabled = false;
};
</script>
</html>
